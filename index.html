<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>GYEONGJU BIRDSEYE V1</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^6.7.0/dist/maplibre-gl.css"/>
<style>html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0d12;font-family:system-ui,-apple-system,sans-serif}.hud{position:absolute;z-index:5;top:14px;left:14px;color:#fff;background:#070a0f99;border:1px solid #ffffff22;border-radius:14px;padding:12px 14px;backdrop-filter:blur(10px)}.hud b{letter-spacing:.15em}.small{font-size:12px;opacity:.75}.clock{font-size:26px;font-weight:800;margin-top:4px}.controls{position:absolute;z-index:5;left:50%;bottom:18px;transform:translateX(-50%);width:min(780px,calc(100% - 30px));background:#070a0fb8;border:1px solid #ffffff22;border-radius:16px;padding:12px;box-sizing:border-box;color:white;backdrop-filter:blur(12px)}.row{display:flex;gap:10px;align-items:center}.row button{background:#232b39;color:#fff;border:0;border-radius:10px;padding:10px 12px;font-weight:700}.row input{width:100%}.hint{font-size:11px;opacity:.66;margin-top:7px;display:flex;justify-content:space-between}.tint{position:absolute;z-index:3;inset:0;pointer-events:none;mix-blend-mode:screen}.shade{position:absolute;z-index:4;inset:0;pointer-events:none;background:radial-gradient(circle at center,transparent 45%,rgba(0,0,0,.33) 100%)}</style></head>
<body><div id="map"></div><div id="tint" class="tint"></div><div class="shade"></div>
<div class="hud"><b>GYEONGJU BIRDSEYE</b><div id="clock" class="clock">06:00</div><div id="phase" class="small">SUNRISE · 경주 중심</div><div id="cam" class="small">ALT 420m · DRONE VIEW</div></div>
<div class="controls"><div class="row"><button id="play">▶</button><button id="home">경주</button><input id="time" type="range" min="360" max="1200" step="1" value="360"></div><div class="hint"><span>06:00 해돋이</span><span>12:00</span><span>18:00</span><span>20:00 야간</span></div></div>
<script type="module">
import * as maplibregl from 'https://unpkg.com/maplibre-gl@^6.7.0/dist/maplibre-gl.mjs';
const center=[129.211,35.842];
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center,zoom:15.4,pitch:67,bearing:-24,antialias:true,maxPitch:85});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');
map.on('load',()=>{
  const layers=map.getStyle().layers||[];
  const label=layers.find(l=>l.type==='symbol')?.id;
  if(!map.getLayer('gyeongju-3d')) map.addLayer({id:'gyeongju-3d',source:'openmaptiles',sourceLayer:'building',type:'fill-extrusion',minzoom:13,paint:{'fill-extrusion-color':['interpolate',['linear'],['coalesce',['get','render_height'],['get','height'],8],0,'#bbb7ae',15,'#d2c6b1',40,'#b8b3aa'],'fill-extrusion-height':['coalesce',['get','render_height'],['get','height'],8],'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':0.82}},label);
});
const tint=document.getElementById('tint'),clock=document.getElementById('clock'),phase=document.getElementById('phase'),slider=document.getElementById('time');
function setTime(m){const h=Math.floor(m/60),mm=m%60;clock.textContent=String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0');let bg='transparent',f='';if(m<450){phase.textContent='SUNRISE · 경주 중심';bg='radial-gradient(circle at 12% 68%,rgba(255,132,55,.55),rgba(255,191,110,.12) 22%,transparent 48%)'}else if(m<1020){phase.textContent=m<720?'MORNING · 경주 중심':'DAYLIGHT · 경주 중심';bg='linear-gradient(rgba(90,155,255,.08),transparent 45%)'}else if(m<1140){phase.textContent='SUNSET · 경주 중심';bg='radial-gradient(circle at 88% 62%,rgba(255,105,45,.55),rgba(255,170,85,.12) 24%,transparent 50%)'}else{phase.textContent='EVENING · 경주 중심';bg='linear-gradient(rgba(20,28,62,.35),rgba(4,7,18,.48))'}tint.style.background=bg;const br=m<420?.82:m<1080?1:m<1140?.88:.62;document.getElementById('map').style.filter=`brightness(${br}) saturate(${m>1020?1.15:1})`;}
slider.oninput=e=>setTime(+e.target.value);setTime(+slider.value);
let run=false,timer;document.getElementById('play').onclick=()=>{run=!run;document.getElementById('play').textContent=run?'⏸':'▶';if(run)timer=setInterval(()=>{let v=+slider.value+2;if(v>1200)v=360;slider.value=v;setTime(v)},90);else clearInterval(timer)};
document.getElementById('home').onclick=()=>map.flyTo({center,zoom:15.4,pitch:67,bearing:-24,duration:1800});
let keys={};window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);function fly(){const z=map.getZoom(),step=0.0005*Math.pow(2,15-z);let c=map.getCenter(),b=map.getBearing()*Math.PI/180;if(keys['w']||keys['arrowup']){c.lng+=Math.sin(b)*step;c.lat+=Math.cos(b)*step}if(keys['s']||keys['arrowdown']){c.lng-=Math.sin(b)*step;c.lat-=Math.cos(b)*step}if(keys['a'])map.rotateTo(map.getBearing()-1,{duration:0});if(keys['d'])map.rotateTo(map.getBearing()+1,{duration:0});if(keys['q'])map.zoomTo(z+.03,{duration:0});if(keys['e'])map.zoomTo(z-.03,{duration:0});map.setCenter(c);requestAnimationFrame(fly)}fly();
</script></body></html>
